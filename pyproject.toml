[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"


[project]
name = "shooter"
version = "0.1.0"
description = "Boson camera control"
requires-python = ">=3.9"


[tool.setuptools.packages.find]
where = [
    "src",
    "external/boson-sdk/src"
]


[tool.setuptools.package-data]
shooter = ["conf/*.json"]


[project.scripts]
shooter = "shooter.shooter:main"
